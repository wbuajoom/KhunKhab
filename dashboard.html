<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>คุณคาบ — วันนี้</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans Thai', sans-serif; background: #f9fafb; color: #111827; }

  /* Nav */
  .nav {
    background: white;
    border-bottom: 1px solid #e5e7eb;
    padding: 0 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
    position: sticky; top: 0; z-index: 100;
  }
  .nav-brand { font-weight: 700; font-size: 18px; color: #064e3b; }
  .nav-user { font-size: 13px; color: #6b7280; display: flex; align-items: center; gap: 8px; }
  .btn-logout { background: none; border: 1px solid #e5e7eb; border-radius: 8px; padding: 4px 12px; font-size: 12px; cursor: pointer; color: #6b7280; font-family: inherit; }
  .btn-logout:hover { border-color: #ef4444; color: #ef4444; }

  /* Main */
  .main { max-width: 800px; margin: 0 auto; padding: 24px 16px; }
  .greeting { font-size: 20px; font-weight: 600; color: #111827; margin-bottom: 4px; }
  .date-label { font-size: 14px; color: #6b7280; margin-bottom: 24px; }

  /* Section */
  .section-title { font-size: 13px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }

  /* Period card */
  .period-card {
    background: white;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 12px;
    border: 2px solid transparent;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    transition: all 0.15s;
  }
  .period-card.current {
    border-color: #10b981;
    background: #f0fdf4;
  }
  .period-card.past { opacity: 0.6; }
  .period-time { font-size: 13px; color: #6b7280; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
  .badge-now { background: #10b981; color: white; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px; }
  .period-subject { font-size: 17px; font-weight: 600; color: #111827; margin-bottom: 4px; }
  .period-meta { font-size: 13px; color: #6b7280; margin-bottom: 16px; }
  .period-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-action {
    padding: 8px 16px;
    border-radius: 10px;
    border: none;
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-primary { background: #10b981; color: white; }
  .btn-primary:hover { background: #059669; }
  .btn-secondary { background: #f3f4f6; color: #374151; }
  .btn-secondary:hover { background: #e5e7eb; }

  /* Empty state */
  .empty { text-align: center; padding: 48px 16px; color: #9ca3af; }
  .empty-icon { font-size: 40px; margin-bottom: 12px; }

  /* Skeleton */
  .skeleton { background: #e5e7eb; border-radius: 8px; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
  .sk-card { height: 120px; border-radius: 16px; margin-bottom: 12px; }

  /* Bottom nav (mobile) */
  .bottom-nav {
    display: none;
    position: fixed; bottom: 0; left: 0; right: 0;
    background: white;
    border-top: 1px solid #e5e7eb;
    padding: 8px 0 env(safe-area-inset-bottom);
    z-index: 100;
  }
  .bottom-nav-inner { display: flex; justify-content: space-around; }
  .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 16px; text-decoration: none; color: #9ca3af; font-size: 11px; }
  .nav-item.active { color: #10b981; }
  .nav-item span:first-child { font-size: 22px; }

  @media (max-width: 768px) {
    .bottom-nav { display: block; }
    .main { padding-bottom: 80px; }
  }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-brand">📚 คุณคาบ</div>
  <div class="nav-user">
    <span id="nav-name">...</span>
    <button class="btn-logout" onclick="logout()">ออก</button>
  </div>
</nav>

<main class="main">
  <div class="greeting" id="greeting">สวัสดี...</div>
  <div class="date-label" id="date-label">กำลังโหลด...</div>

  <div class="section-title">ตารางสอนวันนี้</div>
  <div id="schedule-container">
    <div class="skeleton sk-card"></div>
    <div class="skeleton sk-card"></div>
  </div>
</main>

<nav class="bottom-nav">
  <div class="bottom-nav-inner">
    <a href="dashboard.html" class="nav-item active">
      <span>🏠</span><span>วันนี้</span>
    </a>
    <a href="attendance.html" class="nav-item">
      <span>✅</span><span>เช็กชื่อ</span>
    </a>
    <a href="scorebook.html" class="nav-item">
      <span>📊</span><span>คะแนน</span>
    </a>
  </div>
</nav>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbzzjcklOEs2uKhuV198lVSwkvC3qbQx5HLpF5MucP1rI4AVzLfDYCOna514md5Y5tLL/exec';

// Auth check
const token = localStorage.getItem('kk_token');
if (!token) window.location.href = 'index.html';

const name = localStorage.getItem('kk_name') || 'คุณครู';
document.getElementById('nav-name').textContent = name;
document.getElementById('greeting').textContent = 'สวัสดี ' + name;

// Date
const DOW = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const now = new Date();
const dateStr = `วัน${DOW[now.getDay()]}ที่ ${now.getDate()} ${['','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'][now.getMonth()+1]} ${now.getFullYear()+543}`;
document.getElementById('date-label').textContent = dateStr;

// Load data
async function load() {
  try {
    const res = await callAPI('getBootstrap');
    if (!res.ok) throw new Error(res.error);

    localStorage.setItem('kk_bootstrap', JSON.stringify(res));
    renderSchedule(res.todaySchedule);
  } catch(err) {
    document.getElementById('schedule-container').innerHTML =
      `<div class="empty"><div class="empty-icon">⚠️</div><div>${err.message}</div></div>`;
  }
}

function renderSchedule(schedule) {
  const container = document.getElementById('schedule-container');
  if (!schedule || !schedule.entries || schedule.entries.length === 0) {
    container.innerHTML = `<div class="empty"><div class="empty-icon">🎉</div><div>ไม่มีคาบสอนวันนี้</div></div>`;
    return;
  }

  container.innerHTML = schedule.entries.map(e => `
    <div class="period-card ${e.isCurrent ? 'current' : ''} ${e.isPast ? 'past' : ''}">
      <div class="period-time">
        ${e.startTime} – ${e.endTime}
        ${e.isCurrent ? '<span class="badge-now">คาบนี้</span>' : ''}
      </div>
      <div class="period-subject">${e.subjectName || e.subjectCode}</div>
      <div class="period-meta">${e.sectionName}${e.location ? ' · ' + e.location : ''}</div>
      <div class="period-actions">
        <button class="btn-action btn-primary"
          onclick="goAttendance('${e.courseSectionId}')">
          ✅ เช็กชื่อ
        </button>
        <button class="btn-action btn-secondary"
          onclick="goScorebook('${e.courseSectionId}')">
          📊 คะแนน
        </button>
      </div>
    </div>
  `).join('');
}

function goAttendance(sectionId) {
  localStorage.setItem('kk_current_section', sectionId);
  window.location.href = 'attendance.html';
}

function goScorebook(sectionId) {
  localStorage.setItem('kk_current_section', sectionId);
  window.location.href = 'scorebook.html';
}

function logout() {
  localStorage.clear();
  window.location.href = 'index.html';
}

async function callAPI(action, extra = {}) {
  const token = localStorage.getItem('kk_token');
  const res = await fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify({ action, token, ...extra }),
  });
  return res.json();
}

load();
</script>
</body>
</html>
