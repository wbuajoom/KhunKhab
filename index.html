<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>คุณคาบ — ครบทุกเรื่องในคาบเดียว</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans Thai', sans-serif;
    background: #f0fdf4;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .login-card {
    background: white;
    border-radius: 20px;
    padding: 48px 40px;
    text-align: center;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    max-width: 380px;
    width: 90%;
  }
  .logo { font-size: 48px; margin-bottom: 8px; }
  h1 { font-size: 28px; font-weight: 700; color: #064e3b; margin-bottom: 4px; }
  .tagline { color: #6b7280; font-size: 14px; margin-bottom: 40px; }
  .btn-google {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    padding: 14px 20px;
    border: 2px solid #e5e7eb;
    border-radius: 12px;
    background: white;
    font-family: 'Noto Sans Thai', sans-serif;
    font-size: 15px;
    font-weight: 500;
    color: #374151;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-google:hover { border-color: #10b981; background: #f0fdf4; }
  .btn-google svg { width: 20px; height: 20px; }
  .error { color: #dc2626; font-size: 13px; margin-top: 16px; display: none; }
  .version { color: #9ca3af; font-size: 11px; margin-top: 32px; }
</style>
</head>
<body>

<div class="login-card">
  <div class="logo">📚</div>
  <h1>คุณคาบ</h1>
  <p class="tagline">ครบทุกเรื่องในคาบเดียว</p>

  <button class="btn-google" onclick="signIn()">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
      <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
      <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
      <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
    </svg>
    เข้าสู่ระบบด้วย Google
  </button>

  <p class="error" id="error-msg">เกิดข้อผิดพลาด กรุณาลองใหม่</p>
  <p class="version">คุณคาบ v2.0</p>
</div>

<!-- Google Identity Services -->
<script src="https://accounts.google.com/gsi/client" async></script>
<script>
  const CLIENT_ID = '275550795528-l1ea3np27p8qfm0ls7mdc1tba2mct0dt.apps.googleusercontent.com'; // จะแก้ทีหลัง
  const API_URL   = 'https://script.google.com/macros/s/AKfycbzzjcklOEs2uKhuV198lVSwkvC3qbQx5HLpF5MucP1rI4AVzLfDYCOna514md5Y5tLL/exec';

  // ถ้า login แล้ว ไป dashboard เลย
  if (localStorage.getItem('kk_token')) {
    window.location.href = 'dashboard.html';
  }

  function signIn() {
    if (!window.google) {
      document.getElementById('error-msg').style.display = 'block';
      return;
    }
    google.accounts.id.initialize({
      client_id: CLIENT_ID,
      callback: handleCredential,
      ux_mode: 'popup',
    });
    google.accounts.id.prompt();
  }

  function handleCredential(response) {
    const token = response.credential;
    localStorage.setItem('kk_token', token);
    // Decode name from JWT (no verify needed here — server verifies)
    try {
      const payload = JSON.parse(atob(token.split('.')[1]));
      localStorage.setItem('kk_name', payload.name || payload.email);
      localStorage.setItem('kk_email', payload.email);
    } catch(_) {}
    window.location.href = 'dashboard.html';
  }
</script>

</body>
</html>
